name: Native release

# Builds the phone app's signed Android APK and attaches it to a GitHub release tagged android-v<version>, the version in
# native/app.config.ts. Run by hand only; the server's own releases are release.yml. The release is never marked latest,
# so releases/latest keeps pointing at the server's binaries for install.sh and `nexul upgrade`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: native
    env:
      NEXUL_UPDATES_URL: ${{ vars.NEXUL_UPDATES_URL }}
      NEXUL_UPDATES_APP_ID: ${{ vars.NEXUL_UPDATES_APP_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - name: Resolve the version and refuse an existing tag
        id: version
        run: |
          set -euo pipefail
          version=$(bunx expo config --type public --json | jq -r .version)
          tag="android-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; bump version in native/app.config.ts first." >&2
            exit 1
          fi
          if [[ -z "$NEXUL_UPDATES_URL" || -z "$NEXUL_UPDATES_APP_ID" ]]; then
            echo "::warning::NEXUL_UPDATES_URL or NEXUL_UPDATES_APP_ID is unset; this APK will never receive over-the-air updates."
          fi
          echo "Building $tag"
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - run: bun run prebuild
      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || { echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing." >&2; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the signed APK
        working-directory: native/android
        env:
          ORG_GRADLE_PROJECT_nexulKeystoreFile: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_nexulKeystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_nexulKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_nexulKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Every current phone is arm64; x86_64 keeps emulators working. Each ABI is a full native compile.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,x86_64
        run: ./gradlew assembleRelease --no-daemon
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk="nexul-android-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --latest=false --title "Nexul for Android $VERSION" \
            --notes "Sideload the APK on an Android phone. JavaScript changes within this version arrive over the air."
