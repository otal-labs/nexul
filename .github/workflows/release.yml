name: Release

# Git tags are the version (ADR 0070). Once a day, if master has moved since its last release, it is cut as a beta
# (ADR 0071) numbered v<line>.<n>-beta, one patch number past the line's last release (ADR 0084); a manual beta run
# cuts one now. A manual stable run promotes the newest beta's commit, under its own number or onto a new line; a
# hand-pushed vX.Y.Z tag builds that tag as stable. GoReleaser (.goreleaser.yaml) builds and publishes whatever tag
# `resolve` picks.
on:
  schedule:
    # 00:07 UTC (01:07 in UK summer time); off the hour, when scheduled runs queue longest.
    - cron: "7 0 * * *"
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      bump:
        description: Stable only. patch releases the newest beta under its own number; minor or major start a new line
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'beta') && 'beta' || 'stable' }}
  cancel-in-progress: false

env:
  # The version line betas count up on until a stable release starts a newer one.
  FIRST_LINE: "0.3"

jobs:
  # Picks the commit and the tag every other job builds, from the tags already in the repository.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A stable tag is bare semver (v0.3.4); a beta has a suffix (v0.3.5-beta). Same rule as version.Channel().
          stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          newest_beta=$(git tag -l 'v*-beta*' | sort -V | tail -n1 || true)
          stable_version=${stable#v}
          line=$(printf '%s\n%s\n' "$FIRST_LINE" "${stable_version%.*}" | sort -V | tail -n1)

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            channel=stable; ref="$SHA"; tag="$REF_NAME"; previous_tag="$stable"
          elif [[ "$EVENT_NAME" == "schedule" || "$INPUT_CHANNEL" == "beta" ]]; then
            channel=beta; ref="$SHA"; previous_tag="$newest_beta"
            # The daily run releases only when master has moved; a manual beta run is asked for, so it always releases.
            if [[ "$EVENT_NAME" == "schedule" && -n "$(git tag --points-at "$SHA")" ]]; then
              echo "master ($SHA) is already released as $(git tag --points-at "$SHA" | head -n1); nothing to cut."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # One past the line's highest patch, beta or stable, so the number alone orders every release.
            last=$(git tag -l "v${line}.*" | sed -nE "s/^v${line//./\\.}\.([0-9]+)(-beta)?$/\1/p" | sort -n | tail -n1)
            tag="v${line}.$(( ${last:--1} + 1 ))-beta"
          else
            channel=stable; previous_tag="$stable"
            if [[ -z "$newest_beta" ]]; then
              echo "::error::No beta exists yet to promote to stable." >&2
              exit 1
            fi
            if [[ ! "$newest_beta" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-beta$ ]]; then
              echo "::error::$newest_beta predates v<line>.<n>-beta numbering; cut a beta first." >&2
              exit 1
            fi
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            ref=$(git rev-list -n1 "$newest_beta")
            if released=$(git tag --points-at "$ref" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); then
              echo "::error::$newest_beta is already released as $released; merge something new first." >&2
              exit 1
            fi
            case "$INPUT_BUMP" in
              patch) tag="v$major.$minor.$patch" ;;
              minor) tag="v$major.$((minor + 1)).0" ;;
              major) tag="v$((major + 1)).0.0" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Tag $tag already exists." >&2
            exit 1
          fi

          echo "Releasing $tag ($channel) from $ref"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build the web UI into the server
        run: |
          (cd web && bun install --frozen-lockfile && VITE_API_URL=/ bun run build)
          rm -rf server/webui/dist && mkdir -p server/webui/dist && cp -r web/dist/. server/webui/dist/
      - name: Build the automations host binaries
        run: |
          (cd automations && bun install --frozen-lockfile)
          bun run --cwd automations build:binaries
      - name: Tag the commit
        run: git tag -f "${{ needs.resolve.outputs.tag }}"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}

  # nexul.io builds its changelog from the releases at build time, so each release rebuilds the site.
  website:
    needs: release
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
    steps:
      - name: Rebuild nexul.io
        if: env.DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
