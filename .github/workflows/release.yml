name: Release

# Git tags are the version (ADR 0070). Once a day, if master has moved since its last release, it is cut as a beta,
# v<next patch>-beta.<n> (ADR 0071); a manual beta run cuts one now. A manual stable run promotes the newest beta's
# commit with a patch, minor or major bump; a hand-pushed vX.Y.Z tag builds that tag as stable. GoReleaser
# (.goreleaser.yaml) builds and publishes whatever tag `resolve` picks.
on:
  schedule:
    # 03:17 UTC; off the hour, when scheduled runs queue longest.
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      bump:
        description: Stable only. How far the version moves from the last stable release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'beta') && 'beta' || 'stable' }}
  cancel-in-progress: false

env:
  # The first version line, used until a stable release exists to bump from.
  FIRST_VERSION: 0.2.0

jobs:
  # Picks the commit and the tag every other job builds, from the tags already in the repository.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      stable_exists: ${{ steps.resolve.outputs.stable_exists }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A stable tag is bare semver (v0.2.0); a beta has a suffix (v0.2.1-beta.3). Same rule as version.Channel().
          stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          newest_beta=$(git tag -l 'v*-beta.*' | sort -V | tail -n1 || true)
          stable_exists=false
          [[ -n "$stable" ]] && stable_exists=true

          bump() { # $1 = patch|minor|major
            if [[ -z "$stable" ]]; then
              [[ "$1" == major ]] && echo 1.0.0 || echo "$FIRST_VERSION"
              return
            fi
            IFS=. read -r major minor patch <<< "${stable#v}"
            case "$1" in
              patch) echo "$major.$minor.$((patch + 1))" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              major) echo "$((major + 1)).0.0" ;;
            esac
          }

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            channel=stable; ref="$SHA"; tag="$REF_NAME"; previous_tag="$stable"
          elif [[ "$EVENT_NAME" == "schedule" || "$INPUT_CHANNEL" == "beta" ]]; then
            channel=beta; ref="$SHA"; previous_tag="$newest_beta"
            # The daily run releases only when master has moved; a manual beta run is asked for, so it always releases.
            if [[ "$EVENT_NAME" == "schedule" && -n "$(git tag --points-at "$SHA")" ]]; then
              echo "master ($SHA) is already released as $(git tag --points-at "$SHA" | head -n1); nothing to cut."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next=$(bump patch)
            last=$(git tag -l "v${next}-beta.*" | sed "s/^v${next}-beta\.//" | sort -n | tail -n1)
            tag="v${next}-beta.$(( ${last:-0} + 1 ))"
          else
            channel=stable; previous_tag="$stable"
            if [[ -z "$newest_beta" ]]; then
              echo "::error::No beta exists yet to promote to stable." >&2
              exit 1
            fi
            ref=$(git rev-list -n1 "$newest_beta")
            if released=$(git tag --points-at "$ref" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); then
              echo "::error::$newest_beta is already released as $released; merge something new first." >&2
              exit 1
            fi
            tag="v$(bump "$INPUT_BUMP")"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Tag $tag already exists." >&2
            exit 1
          fi

          echo "Releasing $tag ($channel) from $ref"
          {
            echo "channel=$channel"
            echo "ref=$ref"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
            echo "stable_exists=$stable_exists"
          } >> "$GITHUB_OUTPUT"

  # Pushed before the release exists, so an installer never finds a release whose images are missing.
  automations-image:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          STABLE_EXISTS: ${{ needs.resolve.outputs.stable_exists }}
        run: |
          image=ghcr.io/otal-labs/nexul-automations
          tags=("${image}:${TAG#v}")
          [[ "$CHANNEL" == "beta" ]] && tags+=("${image}:beta")
          [[ "$CHANNEL" == "stable" || "$STABLE_EXISTS" != "true" ]] && tags+=("${image}:latest")
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./automations
          build-contexts: root=.
          file: ./automations/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/otal-labs/nexul
          build-args: |
            VERSION=${{ needs.resolve.outputs.tag }}

  release:
    needs: [resolve, automations-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build the web UI into the server
        run: |
          (cd web && bun install --frozen-lockfile && VITE_API_URL=/ bun run build)
          rm -rf server/webui/dist && mkdir -p server/webui/dist && cp -r web/dist/. server/webui/dist/
      # The runner image installs packages, which the arm64 build runs under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the commit
        run: git tag -f "${{ needs.resolve.outputs.tag }}"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
          STABLE_EXISTS: ${{ needs.resolve.outputs.stable_exists }}

  # Beta only: a daily beta means old beta image tags accumulate forever
  # otherwise. actions/delete-package-versions can't do this safely here —
  # for container packages its ignore-versions regex matches the version's
  # digest (`.name`), not its tags, so it can't tell a "latest"/stable tag
  # apart from a beta one; a blind min-versions-to-keep could delete the
  # wrong image. List and delete by tag instead.
  prune:
    needs: [resolve, release]
    if: needs.resolve.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Delete old beta image versions
        run: |
          set -euo pipefail
          for pkg in nexul nexul-runner nexul-automations; do
            echo "Pruning ${pkg}..."
            # Keep the 10 newest tagged versions and anything tagged latest or
            # a stable semver; untagged multi-arch manifest children are left
            # alone since a kept manifest list may still reference them.
            ids=$(gh api --paginate --slurp "/orgs/${OWNER}/packages/container/${pkg}/versions" | jq -r '
              add | [.[] | {id, created_at, tags: (.metadata.container.tags // [])}]
              | map(select((.tags | length) > 0))
              | map(select((.tags | any(. == "latest" or test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | not))
              | sort_by(.created_at) | reverse | .[10:] | .[].id')
            for id in $ids; do
              echo "  deleting version $id"
              gh api --method DELETE "/orgs/${OWNER}/packages/container/${pkg}/versions/${id}"
            done
          done
