name: Release

# Git tags are the version (ADR 0070). Once a day, if master has moved since its last release, it is cut as a beta,
# v<next patch>-beta.<n> (ADR 0071); a manual beta run cuts one now. A manual stable run promotes the newest beta's
# commit with a patch, minor or major bump; a hand-pushed vX.Y.Z tag builds that tag as stable. GoReleaser
# (.goreleaser.yaml) builds and publishes whatever tag `resolve` picks.
on:
  schedule:
    # 03:17 UTC; off the hour, when scheduled runs queue longest.
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      bump:
        description: Stable only. How far the version moves from the last stable release
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'beta') && 'beta' || 'stable' }}
  cancel-in-progress: false

env:
  # The first version line, used until a stable release exists to bump from.
  FIRST_VERSION: 0.2.0

jobs:
  # Picks the commit and the tag every other job builds, from the tags already in the repository.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BUMP: ${{ inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A stable tag is bare semver (v0.2.0); a beta has a suffix (v0.2.1-beta.3). Same rule as version.Channel().
          stable=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          newest_beta=$(git tag -l 'v*-beta.*' | sort -V | tail -n1 || true)

          bump() { # $1 = patch|minor|major
            if [[ -z "$stable" ]]; then
              [[ "$1" == major ]] && echo 1.0.0 || echo "$FIRST_VERSION"
              return
            fi
            IFS=. read -r major minor patch <<< "${stable#v}"
            case "$1" in
              patch) echo "$major.$minor.$((patch + 1))" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              major) echo "$((major + 1)).0.0" ;;
            esac
          }

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            channel=stable; ref="$SHA"; tag="$REF_NAME"; previous_tag="$stable"
          elif [[ "$EVENT_NAME" == "schedule" || "$INPUT_CHANNEL" == "beta" ]]; then
            channel=beta; ref="$SHA"; previous_tag="$newest_beta"
            # The daily run releases only when master has moved; a manual beta run is asked for, so it always releases.
            if [[ "$EVENT_NAME" == "schedule" && -n "$(git tag --points-at "$SHA")" ]]; then
              echo "master ($SHA) is already released as $(git tag --points-at "$SHA" | head -n1); nothing to cut."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next=$(bump patch)
            last=$(git tag -l "v${next}-beta.*" | sed "s/^v${next}-beta\.//" | sort -n | tail -n1)
            tag="v${next}-beta.$(( ${last:-0} + 1 ))"
          else
            channel=stable; previous_tag="$stable"
            if [[ -z "$newest_beta" ]]; then
              echo "::error::No beta exists yet to promote to stable." >&2
              exit 1
            fi
            ref=$(git rev-list -n1 "$newest_beta")
            if released=$(git tag --points-at "$ref" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); then
              echo "::error::$newest_beta is already released as $released; merge something new first." >&2
              exit 1
            fi
            tag="v$(bump "$INPUT_BUMP")"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Tag $tag already exists." >&2
            exit 1
          fi

          echo "Releasing $tag ($channel) from $ref"
          {
            echo "ref=$ref"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Build the web UI into the server
        run: |
          (cd web && bun install --frozen-lockfile && VITE_API_URL=/ bun run build)
          rm -rf server/webui/dist && mkdir -p server/webui/dist && cp -r web/dist/. server/webui/dist/
      - name: Build the automations host binaries
        run: |
          (cd automations && bun install --frozen-lockfile)
          bun run --cwd automations build:binaries
      - name: Tag the commit
        run: git tag -f "${{ needs.resolve.outputs.tag }}"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}

  # nexul.io builds its changelog from the releases at build time, so each release rebuilds the site.
  website:
    needs: release
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
    steps:
      - name: Rebuild nexul.io
        if: env.DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
