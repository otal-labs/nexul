name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      website: ${{ steps.filter.outputs.website }}
      sdk: ${{ steps.filter.outputs.sdk }}
      automations: ${{ steps.filter.outputs.automations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'server/**'
              - 'runner/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'sqlc.yaml'
            web:
              - 'web/**'
            desktop:
              - 'desktop/**'
            website:
              - 'website/**'
            sdk:
              - 'sdk/**'
              - 'internal/integrations/catalog.go'
            automations:
              - 'automations/**'

  go-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - uses: sqlc-dev/setup-sqlc@v1
        with:
          sqlc-version: '1.31.1'
      - name: Generated SQL code is current
        run: |
          sqlc vet
          sqlc diff
      - run: go build ./...
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: go tool govulncheck ./...
      - name: Test with coverage gate
        run: make coverage
      - uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: |
            coverage.filtered.out
            coverage.html

  web-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run test -- --coverage
        working-directory: web
      - run: bun run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/lcov.info

  website-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website

  desktop-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      # The desktop unit tests never launch Electron (pure modules + React
      # launcher under jsdom); skipping the binary keeps CI light.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run typecheck
        working-directory: desktop
      - run: bun run test -- --coverage
        working-directory: desktop
      - run: bun run build
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage
          path: desktop/coverage/lcov.info

  sdk-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: sdk
      - run: bun run typecheck
        working-directory: sdk
      - run: bun run test
        working-directory: sdk

  automations-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.automations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: automations
      - run: bun run typecheck
        working-directory: automations
      - run: bun run test
        working-directory: automations
