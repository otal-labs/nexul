name: Bug report
description: Something is broken or behaves differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Runners page
        2. Click "Add runner"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nexul version
      description: The version chip in the web UI, or `GET /api/version` on your instance.
      placeholder: 0.2.0 or a nightly tag
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed
      options:
        - Docker Compose (install.sh / install.ps1)
        - Single binary
        - Debug compose stack (developing Nexul)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, Windows 11 ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the server or runner log, or from OpenObserve. Paste as text, not screenshots.
      render: text
