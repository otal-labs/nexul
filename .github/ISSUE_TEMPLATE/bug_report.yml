name: Bug report
description: Something is broken or behaves differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Runners page
        2. Click "Add runner"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nexul version
      description: The version chip in the web UI, or `GET /api/version` on your instance.
      placeholder: 0.3.4 or a beta such as 0.3.5-beta
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed
      options:
        - nexul install (Linux server)
        - nexul install (Mac or Windows)
        - nexul-server run by hand
        - Debug compose stack (developing Nexul)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS and architecture
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, Windows 11 ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the service's log (`journalctl -u nexul-server` or `journalctl -u nexul-runner-<name>` on Linux, `service.log` in the service's folder on Windows, `~/Library/Logs/nexul/` on a Mac), or from OpenObserve at `/openobserve/`. Paste as text, not screenshots.
      render: text
