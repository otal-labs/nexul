name: Feature request
description: Propose a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Nexul makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: How would you like it to work? Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Docs and tickets
        - Stacks and deploys
        - Runners and CI
        - Topology and DNS
        - MCP server and agents
        - Automations
        - Web UI
        - Desktop app
        - Install and upgrade
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
