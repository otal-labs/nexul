# Builds every release: nexul, nexul-server and nexul-runner for each platform, checksums.txt and the GitHub release.
# release.yml picks the tag and builds the web UI and the nexul-automations binaries before this runs.
version: 2
project_name: nexul

builds:
  - id: nexul
    main: ./cmd/nexul
    binary: nexul
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/otal-labs/nexul/internal/platform/version.Version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
  - id: nexul-server
    main: ./server/cmd
    binary: nexul-server
    tags: [embed]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/otal-labs/nexul/internal/platform/version.Version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
  - id: nexul-runner
    main: ./runner/cmd
    binary: nexul-runner
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/otal-labs/nexul/internal/platform/version.Version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }

# Raw binaries named <binary>-<os>-<arch>: the installer, the runner download proxy and runner self-update fetch
# them by exactly this name and verify them against checksums.txt.
archives:
  - formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./automations/dist/nexul-automations-*

release:
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  target_commitish: "{{ .FullCommit }}"
  name_template: "Nexul {{ .Tag }}"
  extra_files:
    - glob: ./automations/dist/nexul-automations-*

changelog:
  use: github-native
