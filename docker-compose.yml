# The production stack. `nexul install` and `nexul update` write this file
# into the install directory (/data/nexul by default) next to the .env they
# generate; paths below are relative to that directory. The instance runner
# is not here: it runs on the host as the nexul-runner systemd service
# (ADR 0032). To run from source, use docker-compose.debug.yml instead.
name: nexul

services:
  # Server, web UI, runner WebSocket and MCP on one port. Secrets are generated
  # on first start into ./data; everything else comes from the setup wizard.
  server:
    image: ghcr.io/otal-labs/nexul:${NEXUL_VERSION:-latest}
    command: ["serve"]
    ports:
      - "${NEXUL_PORT:-80}:8080"
    environment:
      NEXUL_DB_PATH: /data/nexul.db
      NEXUL_LOG_LEVEL: info
      NEXUL_AUTOMATIONS_HOST_TOKENS_PATH: /data/automations-tokens.json
      NEXUL_OTLP_ENDPOINT: http://openobserve:5080/api/default
      NEXUL_OTLP_USER: ${NEXUL_LOGS_EMAIL:-nexul@nexul.local}
      NEXUL_OTLP_TOKEN: ${NEXUL_LOGS_TOKEN:-dev-logs-token-rotate-me}
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - openobserve

  # Logs, metrics and traces. OpenObserve reads the root user only at its first
  # boot, which is why the installer generates the password up front. Pinned,
  # and sized by the memory limit: it sizes its caches to what it can see.
  openobserve:
    image: openobserve/openobserve:v1.0.0
    ports:
      - "${NEXUL_LOGS_PORT:-5080}:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${NEXUL_LOGS_EMAIL:-nexul@nexul.local}
      ZO_ROOT_USER_PASSWORD: ${NEXUL_LOGS_PASSWORD:-DevLogs-rotate-me-1}
      ZO_ROOT_USER_TOKEN: ${NEXUL_LOGS_TOKEN:-dev-logs-token-rotate-me}
      ZO_TELEMETRY: "false"
    volumes:
      - ./logs:/data
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # Runs the shipped default automations, one worker_thread per automation.
  automations:
    image: ghcr.io/otal-labs/nexul-automations:${NEXUL_VERSION:-latest}
    environment:
      NEXUL_SERVER_URL: http://server:8080
      NEXUL_AUTOMATIONS_TOKENS_PATH: /data/automations-tokens.json
    volumes:
      - ./data:/data:ro
    restart: unless-stopped
    depends_on:
      - server
